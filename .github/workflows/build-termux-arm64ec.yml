name: Termux glibc ARM64EC full build

# A dedicated CI branch enables first runs before default-branch registration.
# This workflow neither publishes Releases nor moves tags.
on:
  push:
    branches: [ci/termux-arm64-full-build]
    paths:
      - '.github/workflows/build-termux-arm64ec.yml'
      - 'ci/build_arm64_termux.py'
      - 'ci/arm64ec_pe.py'
      - 'ci/test_arm64ec_pe.py'
      - 'ci/prepare_termux_glibc_ci.py'
      - 'ci/termux-glibc-aarch64.lock.json'
      - 'ci/patches/dwproton-arm64-prerequisites.patch'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-arm64ec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    env:
      WINE_COMMIT: 6f1e28b249b073e36b5f68eea42f2631163b091f
      GLIBC_PREFIX: /data/data/com.termux/files/usr/glibc
      PREFIX: /data/data/com.termux/files/usr
      LLVM_MINGW_VERSION: '20261117'
      LLVM_MINGW_SHA256: 6d9442ead9ace3b3e4c3389bfef69f93f873305e0705e6cc60978ac895320872
    steps:
      - name: Check out build infrastructure
        uses: actions/checkout@v4
        with:
          path: build-tools
          persist-credentials: false

      - name: Check out pinned Wine source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WINE_COMMIT }}
          path: wine-source
          persist-credentials: false

      - name: Run synthetic PE metadata tests
        run: python3 -B -m unittest discover -s build-tools/ci -p test_arm64ec_pe.py -v

      - name: Install host build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf bison build-essential ca-certificates curl dpkg-dev flex \
            git perl pkg-config python3 xz-utils
          mkdir -p "$RUNNER_TEMP/wine-termux-arm64ec-work" "$RUNNER_TEMP/termux-ci-diagnostics"

      - name: Verify and extract locked Termux glibc packages
        run: |
          set -euo pipefail
          python3 build-tools/ci/prepare_termux_glibc_ci.py --check-only
          cp build-tools/ci/termux-glibc-aarch64.lock.json "$RUNNER_TEMP/termux-ci-diagnostics/"
          python3 build-tools/ci/prepare_termux_glibc_ci.py --install \
            --cache-dir "$RUNNER_TEMP/termux-glibc-packages" \
            2>&1 | tee "$RUNNER_TEMP/termux-ci-diagnostics/bootstrap.log"

      - name: Install pinned LLVM-MinGW cross tools
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-aarch64.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${archive}"
          printf '%s  %s\n' "$LLVM_MINGW_SHA256" "$archive" | sha256sum --check
          tar -xf "$archive"
          printf 'LLVM_MINGW_ROOT=%s/%s\n' "$RUNNER_TEMP" "${archive%.tar.xz}" >> "$GITHUB_ENV"
          printf '%s\n' "${archive%.tar.xz}" > "$RUNNER_TEMP/termux-ci-diagnostics/llvm-mingw-root.txt"
          printf '%s  %s\n' "$LLVM_MINGW_SHA256" "$archive" > "$RUNNER_TEMP/termux-ci-diagnostics/llvm-mingw-sha256.txt"
          {
            "${archive%.tar.xz}/bin/aarch64-w64-mingw32-clang" --version
            "${archive%.tar.xz}/bin/ld.lld" --version
          } > "$RUNNER_TEMP/termux-ci-diagnostics/llvm-mingw-versions.txt" 2>&1

      - name: Apply pinned source prerequisites
        run: |
          set -euo pipefail
          test "$(git -C wine-source rev-parse HEAD)" = "$WINE_COMMIT"
          patch="$GITHUB_WORKSPACE/build-tools/ci/patches/dwproton-arm64-prerequisites.patch"
          git -C wine-source apply --check "$patch"
          git -C wine-source apply "$patch"
          git -C wine-source diff --stat
          git -C build-tools rev-parse HEAD > "$RUNNER_TEMP/termux-ci-diagnostics/infrastructure-commit.txt"

      - name: Supervise full ARM64EC build and staged validation
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH
          unset PKG_CONFIG_PATH PKG_CONFIG_LIBDIR PKG_CONFIG_SYSROOT_DIR
          export CC="$GLIBC_PREFIX/bin/clang"
          export CXX="$GLIBC_PREFIX/bin/clang++"
          export CFLAGS="-O2"
          export CXXFLAGS="-O2"
          # Wine's final Unix links consume LDFLAGS without CFLAGS/CXXFLAGS.
          export LDFLAGS="-fuse-ld=lld"
          export SHELL=/bin/bash CONFIG_SHELL=/bin/bash
          export PKG_CONFIG=/usr/bin/pkg-config
          # The supervisor adds the selected cross tools ahead of Termux tools.
          export PATH="$GLIBC_PREFIX/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          {
            uname -a
            for tool in clang clang++ ld.lld ld make perl python3 pkg-config readelf; do
              command -v "$tool"
            done
            for tool in llvm-dlltool llvm-nm llvm-readobj llvm-objdump; do
              test -x "$LLVM_MINGW_ROOT/bin/$tool"
              printf '%s\n' "$LLVM_MINGW_ROOT/bin/$tool"
            done
            "$CC" --print-search-dirs
            "$CC" -print-prog-name=ld.lld
            "$CC" -print-file-name=crt1.o
            "$CC" -print-file-name=libgcc.a
            readelf -d "$CC"
            readelf -d "$GLIBC_PREFIX/bin/ld.lld"
          } > "$RUNNER_TEMP/termux-ci-diagnostics/tool-paths.txt" 2>&1
          /usr/bin/python3 build-tools/ci/build_arm64_termux.py supervise \
            --profile termux --architecture arm64ec \
            --llvm-mingw-root "$LLVM_MINGW_ROOT" \
            --source "$GITHUB_WORKSPACE/wine-source" --commit "$WINE_COMMIT" \
            --work-dir "$RUNNER_TEMP/wine-termux-arm64ec-work" \
            --glibc-prefix "$GLIBC_PREFIX" --prefix "$GLIBC_PREFIX/opt/wine-arm64ec" \
            --jobs 4 --attempts 3 --heartbeat 30 --retry-delay 60 --idle-timeout 1800 \
            --configure-arg=--with-x --configure-arg=--with-freetype \
            --configure-arg=--with-fontconfig --configure-arg=--with-gnutls \
            --configure-arg=--without-wayland --configure-arg=--without-pulse \
            --configure-arg=--without-gstreamer --configure-arg=--without-ffmpeg

      - name: Record build result
        if: always()
        env:
          BUILD_JOB_STATUS: ${{ job.status }}
        run: |
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]) / "wine-termux-arm64ec-work"
          status = work / "status.json"
          text = status.read_text() if status.exists() else "No supervisor status; see bootstrap or checkout logs."
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Termux glibc ARM64EC Wine\n\n")
              out.write("Job status: " + os.environ["BUILD_JOB_STATUS"] + "\n\n")
              out.write("Wine source: `" + os.environ["WINE_COMMIT"] + "` plus prerequisites patch.\n\n")
              out.write("PE architecture outputs: `ARM64X+ARM64EC+i386`. FEX is not included; "
                        "this build does not establish that x86 or x64 Windows apps can run.\n\n")
              out.write("Build environment: GitHub ARM64 Linux with locked official Termux glibc packages "
                        "and checksum-verified LLVM-MinGW. Android/Termux device execution is not tested.\n\n")
              out.write("```json\n" + text + "\n```\n")
          PY

      - name: Preserve installed hybrid ntdll for independent diagnosis
        if: always()
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          work = Path(os.environ["RUNNER_TEMP"]) / "wine-termux-arm64ec-work"
          candidates = sorted((work / "staging").glob(
              "*/data/data/com.termux/files/usr/glibc/opt/wine-arm64ec/lib/wine/aarch64-windows/ntdll.dll"))
          if not candidates:
              print("No installed hybrid ntdll is available at this build stage.")
          else:
              source = candidates[-1]
              output = work / "pe-reports" / "installed-ntdll"
              output.mkdir(parents=True, exist_ok=True)
              target = output / "ntdll.dll"
              shutil.copy2(source, target)
              evidence = {"source": str(source), "size": target.stat().st_size,
                          "sha256": hashlib.sha256(target.read_bytes()).hexdigest()}
              tool_root = os.environ.get("LLVM_MINGW_ROOT")
              if tool_root:
                  command = [str(Path(tool_root) / "bin/llvm-readobj"),
                             "--file-headers", "--sections", "--coff-load-config", str(target)]
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                          text=True, timeout=120)
                  (output / "llvm-readobj.txt").write_text(result.stdout)
                  evidence["readobj_returncode"] = result.returncode
              (output / "provenance.json").write_text(json.dumps(evidence, indent=2) + "\n")
              print(json.dumps(evidence, indent=2))
          PY

      - name: Upload complete Wine archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wine-termux-arm64ec-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            ${{ runner.temp }}/wine-termux-arm64ec-work/artifacts/*.tar.gz
            ${{ runner.temp }}/wine-termux-arm64ec-work/artifacts/*.sha256

      - name: Upload ARM64EC reports and diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-termux-arm64ec-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/termux-ci-diagnostics/
            ${{ runner.temp }}/termux-glibc-packages/toolchain-checks.txt
            ${{ runner.temp }}/termux-glibc-packages/libxml2-compat-build.log
            ${{ runner.temp }}/termux-glibc-packages/libxml2-compat.json
            ${{ runner.temp }}/termux-glibc-packages/libxml2-compat-build/libxml2-2.13.6/config.log
            ${{ runner.temp }}/wine-termux-arm64ec-work/logs/
            ${{ runner.temp }}/wine-termux-arm64ec-work/*.json
            ${{ runner.temp }}/wine-termux-arm64ec-work/pe-reports/
            ${{ runner.temp }}/wine-termux-arm64ec-work/pe-reports/installed-validation.json
            ${{ runner.temp }}/wine-termux-arm64ec-work/source-changes.patch
            ${{ runner.temp }}/wine-termux-arm64ec-work/build/config.log
            ${{ runner.temp }}/wine-termux-arm64ec-work/build/Makefile
